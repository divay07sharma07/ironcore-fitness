<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | IronCore Fitness</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>IronCore Fitness</h1>

            <h2>Member Login</h2>

            <form id="login-form">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p id="message"></p>

            <p>
                Don't have an account?
                <a href="#" id="signup-link">Create Account</a>
            </p>

        </div>

    </div>

    <script src="auth.js"></script>

    <script>

        const loginForm = document.getElementById("login-form");
        const message = document.getElementById("message");
        const signupLink = document.getElementById("signup-link");

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "Logging in...";

            const { error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                message.textContent = "Login error: " + error.message;
                return;
            }

            message.textContent = "Login successful!";

            window.location.href = "member.html";

        });


        signupLink.addEventListener("click", async function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                message.textContent =
                    "Enter an email and password first.";
                return;
            }

            message.textContent = "Creating account...";

            const { error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        emailRedirectTo:
                            "https://divay07sharma07.github.io/ironcore-fitness/"
                    }
                });

            if (error) {
                message.textContent = error.message;
                return;
            }

            message.textContent =
                "Account created! Check your email to confirm your account.";

        });

    </script>

</body>

</html>
